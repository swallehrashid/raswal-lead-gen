[project]
name = "raswal-lead-generator"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "render: needs Playwright Chromium (playwright install chromium)",
]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["dashboard", "scripts/verify-migrations/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B008"]

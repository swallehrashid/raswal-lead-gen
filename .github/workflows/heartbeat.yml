name: Heartbeat

# One trivial Supabase query a day so the free project never pauses (it pauses after
# 7 days of inactivity), including over the December break.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Query Supabase
        shell: bash
        run: |
          for v in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [[ -z "${!v}" ]]; then echo "::error::Missing secret $v (docs/SETUP_CHECKLIST.md §4 Supabase)"; exit 1; fi
          done
          code=$(curl -sS -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/settings?select=key&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          echo "Supabase responded HTTP $code"
          [[ "$code" == "200" ]]

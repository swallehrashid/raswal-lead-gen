name: Nightly

# Builds the next send day's list: the daily mix (default 20 land developers + 10 property agencies).
# Sunday night builds Monday's list; Thursday night builds Friday's.
on:
  schedule:
    - cron: "30 18 * * 0-4"   # 21:30 EAT (UTC+3), Sunday–Thursday. GitHub may start it late; nothing depends on exact time.
  workflow_dispatch:
    inputs:
      list_date:
        description: "List date YYYY-MM-DD (empty = next send day)"
        required: false
        default: ""
      subcategory:
        description: "Subcategory key (empty = the whole daily mix: land developers + property agencies)"
        required: false
        default: ""
      dry_run:
        description: "Dry run: ≤5 Places calls, no Supabase writes, CSV + teasers as artifacts"
        type: boolean
        default: false
      max_places_calls:
        description: "Lower the Places cap for this run (empty = config default)"
        required: false
        default: ""

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}          # optional: ad-library + Instagram signals
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # inputs go through env (never interpolated into the script) to avoid injection
      IN_LIST_DATE: ${{ inputs.list_date }}
      IN_SUBCATEGORY: ${{ inputs.subcategory }}
      IN_DRY_RUN: ${{ inputs.dry_run }}
      IN_MAX_PLACES: ${{ inputs.max_places_calls }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - run: python -m playwright install --with-deps chromium

      - name: Build tomorrow's list
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          args=()
          [[ -n "$IN_LIST_DATE" ]] && args+=(--list-date "$IN_LIST_DATE")
          [[ -n "$IN_SUBCATEGORY" ]] && args+=(--subcategory "$IN_SUBCATEGORY")
          [[ "$IN_DRY_RUN" == "true" ]] && args+=(--dry-run)
          [[ -n "$IN_MAX_PLACES" ]] && args+=(--max-places-calls "$IN_MAX_PLACES")
          python -m pipeline nightly "${args[@]}" 2>&1 | tee out/nightly.log

      - name: Upload CSV, teasers (dry run) and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

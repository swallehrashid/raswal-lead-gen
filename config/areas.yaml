# Search areas (brief §5.1). Centres are approximate; radius_m is the Places locationBias circle.
#
# tier 1 areas belong to one or more `sets` (subcategories.yaml → area_set picks the set).
# tier 2 and 3 areas are used by every subcategory once its tier-1 cells are exhausted.
# Tier 3 is only used when that subcategory has tier3_enabled: true.
#
# flags: premium / growth → +4 ability-to-pay points (brief §10.2).
# assign_max_km: a business is assigned to the nearest area centre within this distance,
# otherwise to the area of the search cell that found it.

assign_max_km: 12


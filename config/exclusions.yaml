# Hard-gate word lists (brief §8). All matching is case-insensitive on the normalised name
# (lowercase, punctuation stripped, "&" → "and"), on whole words.

# Large brands. Extend freely. A brand match is allowed only if the REST of the name
# (after removing the brand phrase) contains one of dealer_words.
brands:
  # large agencies and developers
  - knight frank
  - hassconsult
  - pam golding
  - lloyd masika
  - cytonn
  - optiven
  - username investments
  - centum
  - superior homes
  - tatu city
  # manufacturers and brands
  - mabati rolling mills
  - safal
  - devki
  - crown paints
  - basco
  - sadolin
  - tile and carpet centre     # the full chain name: "centre" alone would count as a dealer word
  # international contractors
  - china road and bridge
  - china wu yi

dealer_words: [dealer, dealers, stockist, stockists, distributor, distributors, agent, agents, hardware, centre, center, shop, depot, enterprises]

# Listing portals and classifieds: matched on name words or website domain.
portals:
  names: [buyrentkenya, property24, jiji, pigiame, kenya property centre, propertypro, hauzisha, airbnb, booking com, olx]
  domains: [buyrentkenya.com, property24.co.ke, jiji.co.ke, pigiame.co.ke, kenyapropertycentre.com, propertypro.co.ke, hauzisha.co.ke, airbnb.com, booking.com, olx.co.ke]

excluded_types:
  - apartment_building
  - apartment_complex
  - condominium_complex
  - housing_complex
  - lodging
  - hotel
  - motel
  - guest_house
  - hostel
  - bed_and_breakfast
  - extended_stay_hotel
  - shopping_mall
  - school
  - church
  - local_government_office

# Place types that mark a listing as a building (used for the shared-phone rule, §7.5)
building_types: [apartment_building, apartment_complex, condominium_complex, housing_complex]

# BUILDING_NOT_BUSINESS: name matches a building word AND has no business word.
# "estate" counts as a building word unless the name also contains agent/agents.
building_words: [apartment, apartments, court, heights, residence, residences, residency, suites, tower, towers, villa, villas, garden, gardens, plaza, mall, estate,
                 park, paradise, gate, complex, bnb, airbnb, stays, cottages]
building_word_exceptions:
  estate: [agent, agents]
business_words:
  - agency
  - agents
  - realty
  - realtors
  - properties
  - property management
  - homes ltd
  - investments
  - land
  - developers
  - construction
  - builders
  - contractors
  - hardware
  - steel
  - roofing
  - mabati
  - paints
  - plumbing
  - ltd
  - limited
  - enterprises
  - company
  # added (see docs/DECISIONS.md): common Kenyan trade words the brief's list misses
  - real estate
  - lettings
  - letting
  - agencies
  - property managers
  - consultants
  - services
  - supplies
  - suppliers
  - interiors
  - renovations
  - fabricators
  - tiles
  # added after the live dry run: real developers/agencies named like "X Affordable Homes and Property"
  - homes
  - property
  - housing
  - development
  - developments

gov_ngo_words: [county, government, ministry, authority, board, ngo, church, mosque, parish, diocese, cathedral, national housing corporation, kenya urban roads, kenya rural roads, kenha, kura, kerra, nca, nema]

# Stricter rule for the active ad verticals: a name with NO business word must come from a Places
# primaryType that looks like a firm, otherwise it is a building/estate/place (BUILDING_NOT_BUSINESS).
# ("service" is deliberately not allowed: it is what most estates and complexes come back as.)
strict_subcategories: [land_developers, property_agency]
allowed_primary_types: [real_estate_agency, real_estate_developer, property_management_company, consultant, corporate_office]

# Scam check (needs Place Details reviews, so it runs in enrichment). Whole words/phrases, case-insensitive.
#   hard: a review rated ≤ 2 contains one of these → SCAM_RISK gate (excluded)
#   soft: a review rated ≤ 3 contains one of these → score penalty + red chip in the dashboard
# Places returns at most 5 reviews per business, so this catches visible problems, not all of them.
scam_terms:
  hard: [scam, scammer, scammers, fraud, fraudster, fraudsters, conman, con men, conmen, stole, stolen,
         thieves, thief, lost my money, never refunded, dci, police, court case,
         matapeli, tapeli, utapeli, wezi, mwizi, wameniibia, pesa yangu]
  soft: [refund, no title, title deed delay, still waiting for title, still waiting for my title,
         beware, avoid, not genuine, fake]
scam_blocklist: []        # business names Swalleh adds by hand (exact normalised name) → SCAM_RISK

# API caps (brief §2.1, §6.4). These are hard stops in code. Also set the Google Cloud quota
# (SETUP_CHECKLIST §2: Text Search requests/day = 45) as a second safety net.

places:
  calls_per_night: 40
  calls_per_month: 900
  dry_run_calls: 5                # --dry-run default unless --max-places-calls overrides
  target_raw: 350                 # stop discovery after this many unique NEW candidates
  page_size: 20
  max_pages_per_cell: 3
  next_page_min_new_ratio: 0.5    # fetch page 2/3 only if previous page's new ratio ≥ this
  exhausted_new_ratio: 0.2        # a run below this counts toward exhaustion
  exhausted_after_runs: 2
  sku: text_search_enterprise_atmosphere
  split: proportional_to_daily_mix   # the night's Places calls are shared across active subcategories by their mix
  details_per_night: 45              # Place Details (reviews) for every finalist + reserve
  details_per_month: 1000

psi:
  # PageSpeed checks are OFF (0): the ads pitch doesn't use them and they stalled on slow Kenyan sites. Raise to re-enable.
  calls_per_night: 0
  concurrency: 4
  attempts: 2
  cache_days: 30
  timeout_s: 90

gemini:
  calls_per_night: 60
  rpm: 6
  temperature: 0.7
  timeout_s: 60

site_fetch:
  concurrency: 8
  timeout_s: 15
  max_redirects: 5
  max_bytes: 3000000
  blog_fetch: true

render:
  concurrency: 3
  max_per_night: 40
  jpeg_quality: 82
  jpeg_min_quality: 60
  max_kb: 350

retention:
  places_raw_days: 30
  files_days: 30
  # teaser / current-site / brand files are deleted after files_days for leads in these statuses
  # (everything else, e.g. sent, replied, interested and later, keeps its files)
  purge_files_statuses: [skipped, no_response, lost, opted_out, shortlisted, reserve, no_whatsapp]
  db_cap_mb: 400
  storage_cap_mb: 800

# Apify (optional; needs APIFY_TOKEN). Meta's own Ad Library API doesn't cover Kenyan commercial ads, so a weekly
# scrape of the public Ad Library (no login) feeds the "is this business already advertising?" signal.
apify:
  max_ads_per_week: 120          # sized for the free plan ($5/month): ~$0.70/week of ads + ~$0.80/month of Instagram checks
  max_usd_per_month: 4.5
  instagram_per_night: 10
  fresh_days: 8
  actor_ads: apify~facebook-ads-scraper
  actor_instagram: apify~instagram-profile-scraper
  timeout_s: 300
  queries: ["plots for sale", "land for sale", "ready title deed", "apartment for rent", "house for rent"]

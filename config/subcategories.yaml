# One subcategory per list day (brief §5).
#
# RENAMING: the keys below are working names. To rename one, change the key here
# and (optionally) `template`. Nothing in code refers to these names.
#   template: folder name under teasers/web/ and teasers/content/ (defaults to the key)
#
# headline / subline / generic_poster_lines must make NO claims (brief §13.1): no "verified",
# "genuine", "best", "new stock", counts or prices. They appear on every teaser for this subcategory.
# active: only active subcategories are planned. The daily mix (how many leads of each per day) is
#   scoring.yaml selection.daily_mix, overridable from the dashboard (settings.daily_mix).
# ad_hero / ad_palette: the ad-mockup teaser and ad-video template look for this vertical (ads pivot).
# area_set: which tier-1 area list from areas.yaml to use (tier 2/3 are shared by all).

subcategories:
  property_agency:
    label: Property agencies
    active: true
    template: property_agency
    area_set: property
    min_reviews: 8
    tier3_enabled: false
    ability_bonus: 0              # brief §10.2: +3 for land_developers / construction
    manages_listings_is_positive: true
    queries:
      - "real estate agency in {area}"
      - "property management company in {area}"
      - "letting agents {area}"
    headline: "Homes to rent & buy in {area}"
    subline: "Homes to rent and buy, with viewings you can book on WhatsApp."
    cta: "Book a viewing"
    nav: ["Rent", "Buy", "Manage my property", "Contact"]
    generic_poster_lines:
      - "Book a viewing on WhatsApp"
      - "Homes to rent and buy"
      - "Talk to us about managing your property"
    default_palette: {primary: "#0F3D5E", accent: "#D4970F", ink: "#0B1B2B", bg: "#F7F5F0"}
    ad_hero: key
    ad_palette: {primary: "#0F2A44", accent: "#C8A04A", bg: "#F7F4EE", muted: "#5B6B7C", ink: "#0A1420"}

  land_developers:
    label: Land & developers
    active: true
    template: land_developers
    area_set: property
    min_reviews: 8
    tier3_enabled: true
    ability_bonus: 3
    manages_listings_is_positive: false
    queries:
      - "land for sale company {area}"
      - "real estate developers {area}"
      - "plots for sale {area}"
      - "land for sale {area}"
      - "real estate company {area}"
      - "land selling company {area}"
    headline: "Plots for sale around {area}"
    subline: "See available plots and book a site visit on WhatsApp."
    cta: "Book a site visit"
    nav: ["Projects", "Site visits", "How buying works", "Contact"]
    generic_poster_lines:
      - "Book a free site visit"
      - "Ask us how the buying process works"
      - "Visit our office before you buy"
    default_palette: {primary: "#1F5135", accent: "#D4970F", ink: "#14231A", bg: "#F6F4EC"}
    ad_hero: beacon
    ad_palette: {primary: "#0E4D3A", accent: "#D4A537", bg: "#F6F1E4", muted: "#B5532E", ink: "#0B1A14"}

  construction:
    label: Construction
    active: false          # paused until 2027-01-04
    template: construction
    area_set: property
    min_reviews: 8
    tier3_enabled: false
    ability_bonus: 3
    manages_listings_is_positive: false
    queries:
      - "building contractors {area}"
      - "construction company {area}"
      - "renovation contractors {area}"
    headline: "Building & renovation in {area}"
    subline: "See our finished projects and get a quote on WhatsApp."
    cta: "Request a quote"
    nav: ["Projects", "Services", "Process", "Contact"]
    generic_poster_lines:
      - "Request a site assessment"
      - "From foundation to finishing"
      - "See our latest projects"
    default_palette: {primary: "#7A3E12", accent: "#3A95C2", ink: "#1E140C", bg: "#F5F2EE"}

  hardware_supplies:
    label: Hardware & supplies
    active: false          # paused until 2027-01-04
    template: hardware_supplies
    area_set: hardware
    min_reviews: 10
    tier3_enabled: false
    ability_bonus: 0
    manages_listings_is_positive: false
    queries:
      - "hardware shop {area}"
      - "plumbing supplies {area}"
      - "paint shop {area}"
      - "tiles shop {area}"
    headline: "Hardware & building materials in {area}"
    subline: "Check stock, get prices and order on WhatsApp."
    cta: "Order on WhatsApp"
    nav: ["Products", "Delivery areas", "Price list", "Contact"]
    generic_poster_lines:
      - "Order on WhatsApp"
      - "Ask us what's in stock"
      - "Ask about delivery to your site"
    default_palette: {primary: "#9A2A1D", accent: "#D4970F", ink: "#1F0E0B", bg: "#F7F4F1"}

  roofing_steel:
    label: Roofing & steel
    active: false          # paused until 2027-01-04
    template: roofing_steel
    area_set: hardware
    min_reviews: 8
    tier3_enabled: false
    ability_bonus: 0
    manages_listings_is_positive: false
    queries:
      - "mabati roofing sheets {area}"
      - "steel suppliers {area}"
      - "roofing company {area}"
    headline: "Roofing & steel supplies in {area}"
    subline: "Profiles, gauges and colours, with quotes on WhatsApp."
    cta: "Get a quote"
    nav: ["Roofing", "Steel", "Gauges & colours", "Contact"]
    generic_poster_lines:
      - "Get a roofing quote on WhatsApp"
      - "Compare gauges and colours"
      - "Delivery to your site"
    default_palette: {primary: "#23395B", accent: "#E07A1F", ink: "#0E1726", bg: "#F3F5F8"}
